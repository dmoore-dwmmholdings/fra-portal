[package]
name = "ntsb-cli"
version = "0.1.0"
edition = "2021"
description = "`ntsb` command-line pipeline"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ntsb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ntsb-fetch = { path = "../ntsb-fetch" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
