[[class]]
id = "sep_fixed"
name = "Single-engine piston, fixed tricycle gear"
description = "Trainers, tourers and fixed-gear high performance singles (C172, PA-28, SR22, DA40)."
defaults = { engines = 1, propulsion = "piston", gear = "fixed", gear_config = "tricycle" }

[[class]]
id = "sep_retract"
name = "Single-engine piston, retractable gear"
description = "Complex / high-performance retract singles (Bonanza, Mooney, Arrow, C210, PA-46 piston)."
defaults = { engines = 1, propulsion = "piston", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "sep_tailwheel"
name = "Single-engine piston, conventional gear"
description = "Tailwheel light, utility and bush aircraft (J-3, Super Cub, Citabria, C180/185, Husky, Maule)."
defaults = { engines = 1, propulsion = "piston", gear = "fixed", gear_config = "tailwheel" }

[[class]]
id = "sep_aerobatic"
name = "Aerobatic"
description = "Purpose-built aerobatic aircraft (Pitts, Extra, Decathlon, Edge 540, Christen Eagle)."
defaults = { engines = 1, propulsion = "piston", gear = "fixed", gear_config = "tailwheel" }

[[class]]
id = "lsa"
name = "Light sport (S-LSA / E-LSA)"
description = "Factory light-sport designs (CTLS, Tecnam P92/P2008, Cessna 162, Icon A5, SportCruiser)."
defaults = { engines = 1, propulsion = "piston", gear = "fixed", gear_config = "tricycle", cert = "lsa" }

[[class]]
id = "experimental"
name = "Experimental amateur-built (kit)"
description = "Kit/plans-built types usually registered under the builder's name (RV, Lancair, Glasair, Kitfox)."
defaults = { engines = 1, propulsion = "piston", cert = "experimental" }

[[class]]
id = "vintage"
name = "Vintage & warbird"
description = "Ex-military trainers/fighters and classic biplanes (Stearman, T-6, P-51, Yak-52, L-39, Waco)."
defaults = { cert = "limited_or_exhibition" }

[[class]]
id = "agricultural"
name = "Agricultural"
description = "Purpose-built ag aircraft (Air Tractor, Thrush, Ag Cat, Pawnee, AgWagon)."
defaults = { engines = 1, gear = "fixed", gear_config = "tailwheel", cert = "restricted_or_normal" }

[[class]]
id = "amphibian"
name = "Amphibian / flying boat"
description = "Hull amphibians (Lake, Grumman Goose/Widgeon/Mallard, Seabee, SeaRey). Floatplanes stay in their base class."
defaults = { amphibian = true }

[[class]]
id = "mep"
name = "Multi-engine piston"
description = "Piston twins (Baron, Seneca, Seminole, C310/340/414/421, Aztec, Navajo, DA42)."
defaults = { engines = 2, propulsion = "piston", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "set"
name = "Single-engine turboprop"
description = "Caravan, PC-12, TBM, PA-46 turbine, Kodiak, PC-6."
defaults = { engines = 1, propulsion = "turboprop" }

[[class]]
id = "met"
name = "Multi-engine turboprop (business/utility)"
description = "King Air, Conquest, MU-2, Cheyenne, Turbo Commander, Merlin, P180."
defaults = { engines = 2, propulsion = "turboprop", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "regional_turboprop"
name = "Commuter & regional turboprop"
description = "19+ seat commuter/airline turboprops (B1900, Metro, Jetstream, EMB-120, Saab 340, ATR, Dash 8, Twin Otter)."
defaults = { engines = 2, propulsion = "turboprop" }

[[class]]
id = "bizjet_light"
name = "Business jet - very light / light"
description = "Citation Mustang/CJ/I/II/V, Phenom, Eclipse, HondaJet, Learjet 20/30/40, Beechjet/Premier, SF50."
defaults = { engines = 2, propulsion = "turbofan", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "bizjet_midsize"
name = "Business jet - midsize / super-midsize"
description = "Citation Excel/III/Sovereign/Latitude/X/Longitude, Hawker 125, Learjet 55/60, G100-G280, Challenger 300."
defaults = { engines = 2, propulsion = "turbofan", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "bizjet_large"
name = "Business jet - large / long range"
description = "Gulfstream GII-G700, Challenger 600-650, Global, Falcon 50/900/2000/7X/8X, Legacy 600."
defaults = { engines = 2, propulsion = "turbofan", gear = "retract", gear_config = "tricycle" }

[[class]]
id = "regional_jet"
name = "Regional jet"
description = "CRJ, ERJ-135/145, E-Jets, BAe 146/Avro RJ, Fokker 70/100, 328JET."
defaults = { engines = 2, propulsion = "turbofan", gear = "retract", gear_config = "tricycle", cert = "part25" }

[[class]]
id = "narrowbody"
name = "Narrowbody airliner"
description = "737, 757, 727, 707, 717, DC-8, DC-9/MD-80/90, A220, A320 family."
defaults = { propulsion = "turbofan", gear = "retract", gear_config = "tricycle", cert = "part25" }

[[class]]
id = "widebody"
name = "Widebody airliner"
description = "747, 767, 777, 787, DC-10/MD-11, L-1011, A300/310/330/340/350/380."
defaults = { propulsion = "turbofan", gear = "retract", gear_config = "tricycle", cert = "part25" }

[[class]]
id = "legacy_transport"
name = "Legacy piston/turboprop transport"
description = "DC-3, DC-4/6/7, Convair 240-640, C-46, L-188 Electra, L-382/C-130."
defaults = { gear = "retract", cert = "part25_or_car4b" }

[[fallback]]
id = "unclassified_experimental"
name = "Unclassified amateur-built"
when = { homebuilt = true }

[[fallback]]
id = "unclassified_jet"
name = "Unclassified jet"
when = { eng_type = ["TF", "TJ"] }

[[fallback]]
id = "unclassified_turboprop"
name = "Unclassified turboprop"
when = { eng_type = ["TP"] }

[[fallback]]
id = "unclassified_mep"
name = "Unclassified multi-engine piston"
when = { eng_type = ["REC"], num_eng_min = 2 }

[[fallback]]
id = "unclassified_sep"
name = "Unclassified single-engine piston"
when = { eng_type = ["REC"], num_eng_max = 1 }

[[fallback]]
id = "unknown"
name = "Unknown"
when = {  }

