# Causal node dictionary for What–Why Chain Analysis (WWCA). Version 0.2.
#
# Every NTSB occurrence / finding row is mapped to ONE canonical node: the matcher with the highest `prio`
# (default 0) whose `src` equals the row's source and whose `re` matches the row's text wins; ties go to
# file order. `prio` exists because Rust regexes have no lookahead: a specific rule (e.g. "Performance/control
# parameters-Airspeed-…" → act.pilot.airspeed) can beat a broad one (e.g. "airspeed", "brake") without
# reordering nodes, whose file order also sets attachment order (spec §4.6).
# Rows that match nothing are "unmapped" and appear in the QA report. They are never dropped silently.
#
# Node id = dot path. The first segment is the tier family; later segments are finer buckets.
# Roll-up ("granularity g") = the first g segments of the id.
#
# tier       rank  meaning
# outcome     0    injury outcome of this aircraft (made by the builder; no matchers)
# end         1    how the flight ended (collision, forced landing, hard landing, nose-over …)
# critical    2    the critical in-flight / on-ground event (power loss, LOC-I, VFR into IMC …)
# mechanism   3    physical/technical/physiological state that produced it (fuel starvation, AOA exceeded …)
# undetermined 3   NTSB explicitly could not determine the cause
# act         4    a person's action or decision (pilot fuel planning, maintenance error, ATC …)
# latent      5    underlying condition (experience, training, impairment, attention, organization, oversight)
# context     6    environment / conditions (weather, light, terrain, wildlife) – may explain any tier
#
# explains = node-id prefixes this node can be a WHY of. Keep them as narrow as the concept: a broad "mech" on
# a maintenance node would let it attach under mech.aero.* (AOA, performance), which it cannot cause directly. Used to attach findings that NTSB did not
# link to a specific occurrence (all 2008+ findings), and to order the spine (spec §4.4). "" = anything.
# Attachment order: by rank ascending, then by FILE ORDER within a tier – list the more proximate
# node first (e.g. act.pilot.decision before act.pilot.wx_planning).
#
# attribute = true: severity attribute, not a causal node (post-impact fire, evacuation). The builder records
#   it on the graph and keeps it off the chain, so it never becomes the top of the spine.
# implies = "<node id>": when this node is present and no node shares the implied id's first two segments,
#   the builder inserts the implied node (marked implied). Fuel starvation/exhaustion imply a total power loss
#   that NTSB did not always code as an occurrence.
#
# Sources and normalisation (crates/causal-chain/src/text.rs):
#   occ08      = avall Events_Sequence event part only. The raw description is "<phase> <event>" joined by a
#                SPACE; `normalize_occ08` strips the phase. Matchers below see e.g. "Loss of control in flight".
#   find08     = avall Findings.finding_description with the " - C" / " - F" role suffix stripped
#                (`normalize_find08`). Shape: "<Category>-<Section>-<Subsection>-<Item>-<Condition or person>".
#   occ_pre08  = pre2008 Occurrences decoded text.
#   find_pre08 = pre2008 seq_of_events decoded as "SUBJECT - MODIFIER - PERSON".
#
# 2008+ Aircraft findings end in a condition word that says what kind of why the row is:
#   "Incorrect service/maintenance", "Not serviced/maintained", "Inadequate inspection" → act.maint.improper
#   "Incorrect use/operation", "Unintentional use/operation", "Not used/operated"     → a pilot act
#   "Failure", "Malfunction", "Fatigue/wear/corrosion", …                               → the system's mechanism
# The prio-5..7 matchers below implement that routing.
#
# Known era asymmetries (spec §7 rule 3) are noted next to the affected nodes, marked "ERA:".
#
# Iterate with: cargo run --release --bin dict-map -- <texts.tsv>   (spec §10)

schema_version = 2

[weights]          # attribution weight by role (spec §5.3)
sequence = 1.0     # occurrence-derived node
cause = 1.0        # finding with Cause_Factor = C
factor = 0.5       # finding with Cause_Factor = F
finding = 0.25     # finding, neither cause nor factor

# =====================================================================================  OUTCOME
[[node]]
id = "outcome.fatal"
label = "Fatal injury"
tier = "outcome"
[[node]]
id = "outcome.serious"
label = "Serious injury"
tier = "outcome"
[[node]]
id = "outcome.minor"
label = "Minor injury"
tier = "outcome"
[[node]]
id = "outcome.none"
label = "No injury"
tier = "outcome"

# =====================================================================================  CONTEXT
# Listed first so their anchored regexes match before broader mechanism/act regexes.
[[node]]
id = "env.wx.icing"
label = "Icing / carb-icing / freezing precipitation conditions"
tier = "context"
explains = ["mech.induction_icing", "mech.icing", "mech.aero.aoa_exceeded", "crit.loc_inflight", "crit.stall_spin", "mech.fuel", "crit.power_loss", "crit.wx_encounter"]
match = [ { src = "find08", re = '(?i)^Environmental issues-Conditions/weather/phenomena.*(icing|freezing|\bice\b|sleet)' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION.*(ICING|FREEZING)' } ]
[[node]]
id = "env.wx.imc"
label = "IMC / low ceiling / low visibility"
tier = "context"
explains = ["crit.vfr_into_imc", "crit.loss_visual_ref", "mech.spatial_disorientation", "end.cfit", "act.pilot.decision"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(ceiling|visibility|fog|cloud|obscur|IMC|instrument meteorological)' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION.*(CEILING|FOG|CLOUD|OBSCUR|VISIBILITY|IMC)' } ]
[[node]]
id = "env.wx.density_altitude"
label = "High density altitude"
tier = "context"
explains = ["mech.aero.performance", "act.pilot.performance_planning"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(density altitude|high temperature)' },
          { src = "find_pre08", re = '(?i)(DENSITY ALTITUDE|HIGH TEMPERATURE)' } ]
[[node]]
id = "env.traffic"
label = "Other aircraft / wake"
tier = "context"
explains = ["end.midair", "crit.upset", "crit.turbulence", "end.ground_collision"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(other aircraft|wake|traffic congestion)' },
          { src = "find_pre08", re = '(?i)(OTHER AIRCRAFT|WAKE TURBULENCE)' } ]
[[node]]
id = "env.wx.convective"
label = "Thunderstorm / convective weather"
tier = "context"
explains = ["crit.turbulence", "crit.windshear", "crit.wx_encounter", "crit.upset", "crit.loc_inflight", "act.pilot.decision", "latent.pilot.attitude"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(thunderstorm|convective)' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION.*THUNDERSTORM' } ]
[[node]]
id = "env.wx.turbulence"
label = "Mechanical / terrain-induced / clear-air turbulence"
tier = "context"
explains = ["crit.turbulence", "crit.upset", "crit.loc_inflight", "crit.structural"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*turbulence' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION.*TURBULENCE' } ]
[[node]]
id = "env.wx.wind"
label = "Wind / gusts / crosswind / tailwind / downdraft"
tier = "context"
explains = ["act.pilot.wind_comp", "act.pilot.directional_control", "act.pilot.aircraft_control", "mech.aero.uncontrollable", "crit.loc_ground", "end.hard_landing", "end.runway_excursion", "end.cfit", "crit.loc_inflight", "end", "crit.wx_encounter", "crit.windshear", "crit.turbulence"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(wind|gust|draft)' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION.*(WIND|GUST|DRAFT)' } ]
[[node]]
id = "env.light.dark"
label = "Dark night / low light"
tier = "context"
explains = ["mech.visual", "mech.spatial_disorientation", "crit.loss_visual_ref", "end.cfit", "end.collision"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(dark|night|light condition)' },
          { src = "find_pre08", re = '(?i)^LIGHT CONDITION' } ]
[[node]]
id = "env.wildlife"
label = "Bird / wildlife"
tier = "context"
explains = ["crit.birdstrike", "end.collision", "crit.loc_ground"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(bird|wildlife|deer|elk|coyote|livestock|animal-)' },
          { src = "find_pre08", re = '(?i)(BIRD|ANIMAL|WILDLIFE|DEER)' } ]
[[node]]
id = "env.obstacle"
label = "Wires / towers / obstacles / vehicles / structures"
tier = "context"
explains = ["end.collision", "end", "crit.low_alt", "crit.other"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(wire|power line|tower|pole|obstruction|building|fence|sign/marker|ground vehicle|ground equipment|wall/barricade|airport structure|hidden/submerged|Object/animal/substance-(Aircraft|\(general\)))' },
          { src = "find_pre08", re = '(?i)^(OBJECT|WIRE|TOWER|POLE|OBSTRUCTION)' } ]
[[node]]
id = "env.runway"
label = "Runway / surface condition / debris"
tier = "context"
explains = ["crit.loc_ground", "end.runway_excursion", "end.nose_over", "mech.brakes", "end", "crit"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(runway|surface|snow|slush|wet|contamina|grass|soft|debris|foreign object)' },
          { src = "find_pre08", re = '(?i)^(AIRPORT FACILITIES|RUNWAY CONDITION|TERRAIN CONDITION.*(SOFT|SNOW|WET|MUD))' } ]
[[node]]
id = "env.terrain"
label = "Terrain / trees / unsuitable landing area"
tier = "context"
explains = ["end.forced_landing", "end.collision", "end.nose_over", "end", "act.pilot.altitude_clearance", "act.pilot.emergency_proc"]
match = [ { src = "find08", re = '(?i)^Environmental issues.*(terrain|tree|vegetation|rough|uneven|water|mountain)' },
          { src = "find_pre08", re = '(?i)^TERRAIN CONDITION' } ]
[[node]]
id = "env.other"
label = "Other environmental condition"
tier = "context"
explains = [""]
match = [ { src = "find08", re = '(?i)^Environmental issues' },
          { src = "find_pre08", re = '(?i)^WEATHER CONDITION' } ]

# =====================================================================================  END (how the flight ended)
[[node]]
id = "end.cfit"
label = "Controlled flight into terrain/object"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^controlled flight into terr' } ]
[[node]]
id = "end.midair"
label = "Midair collision"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^midair collision' }, { src = "occ_pre08", re = '(?i)MIDAIR' } ]
[[node]]
id = "end.forced_landing"
label = "Off-field / emergency / forced landing"
tier = "end"
explains = ["end.collision", "end.nose_over", "end.ditching", "end.hard_landing", "outcome"]
match = [ { src = "occ08", re = '(?i)^off-field or emergency landing|forced landing' }, { src = "occ_pre08", re = '(?i)^FORCED LANDING' } ]
[[node]]
id = "end.ditching"
label = "Ditching"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^ditching' }, { src = "occ_pre08", re = '(?i)DITCHING' } ]
[[node]]
id = "end.collision"
label = "Collision with terrain/object (non-CFIT), incl. during takeoff/landing"
tier = "end"
explains = ["outcome"]
# "Collision during takeoff/land" is an airborne or rolling impact with trees/fences/hangars, not a taxi collision.
match = [ { src = "occ08", re = '(?i)^collision with terr/obj \(non-CFIT\)|^collision during takeoff/land' },
          { src = "occ_pre08", re = '(?i)IN ?FLIGHT COLLISION WITH (TERRAIN|WATER|OBJECT)|ON GROUND/WATER (COLLISION WITH OBJECT|ENCOUNTER WITH TERRAIN)' } ]
[[node]]
id = "end.ground_collision"
label = "Ground collision (taxi / parked) / person struck"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^ground collision|^AC/prop/rotor contact w person' } ]
[[node]]
id = "end.hard_landing"
label = "Hard landing"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^hard landing' }, { src = "occ_pre08", re = '(?i)HARD LANDING' } ]
[[node]]
id = "end.runway_excursion"
label = "Runway excursion / overrun / undershoot / overshoot"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^runway excursion|^landing area (undershoot|overshoot)' }, { src = "occ_pre08", re = '(?i)OVERRUN|UNDERSHOOT' } ]
[[node]]
id = "end.gear_up"
label = "Gear-up / gear not configured landing"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^landing gear not configured' }, { src = "occ_pre08", re = '(?i)(WHEELS|GEAR) UP' } ]
[[node]]
id = "end.gear_collapse"
label = "Landing gear collapse"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^landing gear collapse' }, { src = "occ_pre08", re = '(?i)GEAR COLLAPSE' } ]
[[node]]
id = "end.abnormal_runway_contact"
label = "Abnormal runway contact (tail/prop/wing strike, bounce)"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^abnormal runway contact|^tailstrike' } ]
[[node]]
id = "end.nose_over"
label = "Nose-over / nose-down / roll-over"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^nose over|^roll over' }, { src = "occ_pre08", re = '(?i)NOSE (OVER|DOWN)' } ]
[[node]]
id = "end.dragged_wing"
label = "Dragged wing / float / tail"
tier = "end"
explains = ["outcome"]
match = [ { src = "occ08", re = '(?i)^dragged wing' }, { src = "occ_pre08", re = '(?i)DRAGGED WING' } ]
[[node]]
id = "end.post_impact_fire"
label = "Post-impact fire / explosion"
tier = "end"
attribute = true
match = [ { src = "occ08", re = '(?i)^(fire/smoke|explosion) \(post-impact\)' } ]
[[node]]
id = "end.evacuation"
label = "Evacuation"
tier = "end"
attribute = true
match = [ { src = "occ08", re = '(?i)^evacuation' } ]

# =====================================================================================  CRITICAL EVENT
[[node]]
id = "crit.power_loss.total"
label = "Loss of engine power (total)"
tier = "critical"
explains = ["end", "crit.loc_inflight", "crit.stall_spin", "crit.recovery_attempt"]
match = [ { src = "occ08", re = '(?i)^loss of engine power \(total\)' },
          { src = "occ_pre08", re = '(?i)LOSS OF ENGINE POWER\s*\(TOTAL\)|^LOSS OF ENGINE POWER\s*($|-)' } ]
[[node]]
id = "crit.power_loss.partial"
label = "Loss of engine power (partial)"
tier = "critical"
# NTSB codes a total loss of ONE engine on a twin as "partial" (seen in 2024 data); read with the engine count.
explains = ["end", "crit.loc_inflight", "crit.stall_spin", "crit.recovery_attempt"]
match = [ { src = "occ08", re = '(?i)^loss of engine power \(partial\)' }, { src = "occ_pre08", re = '(?i)LOSS OF ENGINE POWER\s*\(PARTIAL\)' } ]
[[node]]
id = "crit.powerplant"
label = "Powerplant failure / malfunction / shutdown (power loss not coded)"
tier = "critical"
explains = ["crit.power_loss", "crit.fire_inflight", "end", "crit.loc_inflight"]
match = [ { src = "occ08", re = '(?i)^(powerplant sys/comp malf/fail|uncontained engine failure|engine shutdown)' } ]
[[node]]
id = "crit.vfr_into_imc"
label = "VFR encounter with IMC"
tier = "critical"
explains = ["crit.loc_inflight", "crit.loss_visual_ref", "end.cfit", "end"]
match = [ { src = "occ08", re = '(?i)^VFR encounter with IMC' }, { src = "occ_pre08", re = '(?i)VFR (FLIGHT )?INTO IMC' } ]
[[node]]
id = "crit.loss_visual_ref"
label = "Loss of visual reference"
tier = "critical"
explains = ["crit.loc_inflight", "end.cfit", "end"]
match = [ { src = "occ08", re = '(?i)^loss of visual reference' } ]
[[node]]
id = "crit.wx_encounter"
label = "Other weather encounter (incl. structural icing encounter)"
tier = "critical"
explains = ["crit.loc_inflight", "crit.stall_spin", "end"]
match = [ { src = "occ08", re = '(?i)^other weather encounter' } ]
[[node]]
id = "crit.stall_spin"
label = "Aerodynamic stall / spin"
tier = "critical"
explains = ["crit.loc_inflight", "end"]
match = [ { src = "occ08", re = '(?i)^aerodynamic stall/spin' }, { src = "occ_pre08", re = '(?i)^STALL|SPIN' } ]
[[node]]
id = "crit.loc_inflight"
label = "Loss of control in flight"
tier = "critical"
explains = ["end", "crit.structural", "crit.recovery_attempt"]
match = [ { src = "occ08", re = '(?i)^(loss of control in flight|loss of tail rotor effectiveness|settling with power|mast bumping|retreating blade stall)' },
          { src = "occ_pre08", re = '(?i)LOSS OF CONTROL\s*-\s*IN FLIGHT' } ]
[[node]]
id = "crit.loc_ground"
label = "Loss of control on ground"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^(loss of control on ground|dynamic rollover|ground resonance)' }, { src = "occ_pre08", re = '(?i)LOSS OF CONTROL\s*-\s*ON GROUND|GROUND LOOP|SWERVE' } ]
[[node]]
id = "crit.abrupt_maneuver"
label = "Abrupt maneuver"
tier = "critical"
explains = ["crit.loc_inflight", "crit.stall_spin", "crit.structural", "end"]
match = [ { src = "occ08", re = '(?i)^abrupt maneuver' } ]
[[node]]
id = "crit.upset"
label = "Inflight upset"
tier = "critical"
explains = ["crit.loc_inflight", "end"]
match = [ { src = "occ08", re = '(?i)^inflight upset' } ]
[[node]]
id = "crit.windshear"
label = "Windshear / thunderstorm encounter"
tier = "critical"
explains = ["crit.loc_inflight", "end"]
match = [ { src = "occ08", re = '(?i)^windshear or thunderstorm' }, { src = "occ_pre08", re = '(?i)WINDSHEAR' } ]
[[node]]
id = "crit.turbulence"
label = "Turbulence / wake encounter"
tier = "critical"
explains = ["crit.loc_inflight", "crit.structural", "end"]
match = [ { src = "occ08", re = '(?i)turbulence encounter|^aircraft wake turb encounter' }, { src = "occ_pre08", re = '(?i)TURBULENCE' } ]
[[node]]
id = "crit.structural"
label = "Part separation / structural failure in flight"
tier = "critical"
explains = ["crit.loc_inflight", "end"]
match = [ { src = "occ08", re = '(?i)^part\(s\) separation|^aircraft structural failure' } ]
[[node]]
id = "crit.sys_failure"
label = "System / component failure (non-powerplant)"
tier = "critical"
explains = ["end", "crit.loc_inflight", "crit.power_loss"]
match = [ { src = "occ08", re = '(?i)^(sys/comp malf/fail \(non-power\)|flight control sys|electrical system|pressure/environ sys|flight instrument|nav system|comm system)' },
          { src = "occ_pre08", re = '(?i)AIRFRAME/COMPONENT/SYSTEM FAILURE' } ]
[[node]]
id = "crit.fire_inflight"
label = "Fire / smoke / explosion (non-impact)"
tier = "critical"
explains = ["end", "crit.loc_inflight"]
match = [ { src = "occ08", re = '(?i)^(fire/smoke|explosion) \(non-impact\)' }, { src = "occ_pre08", re = '(?i)^FIRE' } ]
[[node]]
id = "crit.birdstrike"
label = "Bird / wildlife strike or encounter"
tier = "critical"
explains = ["end", "crit.power_loss"]
match = [ { src = "occ08", re = '(?i)^birdstrike|^wildlife encounter' }, { src = "occ_pre08", re = '(?i)BIRD|ANIMAL' } ]
[[node]]
id = "crit.nav_deviation"
label = "Navigation error / course or altitude deviation / wrong airport"
tier = "critical"
explains = ["end.cfit", "end.collision", "crit.low_alt", "end"]
match = [ { src = "occ08", re = '(?i)^(navigation error|course deviation|altitude deviation|wrong surface or wrong airport|airspace incursion)' } ]
[[node]]
id = "crit.low_alt"
label = "Low altitude operation / event"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^low altitude operation' } ]
[[node]]
id = "crit.loss_of_lift"
label = "Loss of lift (glider, balloon, settling)"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^loss of lift' } ]
[[node]]
id = "crit.runway_incursion"
label = "Runway incursion (vehicle / aircraft / person)"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^runway incursion' } ]
[[node]]
id = "crit.simulated"
label = "Simulated emergency / training maneuver"
tier = "critical"
explains = ["crit", "end"]
match = [ { src = "occ08", re = '(?i)^simulated/training event' } ]
[[node]]
id = "crit.recovery_attempt"
label = "Attempted remediation / recovery"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^attempted remediation/recovery' } ]
[[node]]
id = "crit.other"
label = "Miscellaneous / other occurrence"
tier = "critical"
explains = ["end"]
match = [ { src = "occ08", re = '(?i)^(miscellaneous/other|cabin safety event|airport occurrence|prop/jet/rotor blast|external load event|glider tow event|emergency descent initiated|stall warn|near midair|collision avoidance alert|terrain avoidance alert|security/criminal event|hazardous material)' },
          { src = "occ_pre08", re = '(?i)MISCELLANEOUS' } ]

# =====================================================================================  MECHANISM
[[node]]
id = "mech.fuel.starvation"
label = "Fuel starvation (fuel on board, not reaching engine)"
tier = "mechanism"
explains = ["crit.power_loss", "end", "crit.powerplant"]
implies = "crit.power_loss.total"
match = [ { src = "occ08", re = '(?i)^fuel starvation' }, { src = "find08", re = '(?i)^Aircraft-.*starvation' },
          { src = "find_pre08", re = '(?i)^FLUID,\s*FUEL\s*-\s*STARVATION|FUEL STARVATION' } ]
[[node]]
id = "mech.fuel.exhaustion"
label = "Fuel exhaustion (no usable fuel)"
tier = "mechanism"
explains = ["crit.power_loss", "end", "crit.powerplant"]
implies = "crit.power_loss.total"
match = [ { src = "occ08", re = '(?i)^fuel exhaustion' }, { src = "find08", re = '(?i)^Aircraft-.*fuel.*(exhaustion|fluid level)' },
          { src = "find_pre08", re = '(?i)^FLUID,\s*FUEL\s*-\s*EXHAUSTION|FUEL EXHAUSTION' } ]
[[node]]
id = "mech.fuel.contamination"
label = "Fuel contamination / wrong fuel"
tier = "mechanism"
explains = ["crit.power_loss", "end", "crit.powerplant"]
match = [ { src = "occ08", re = '(?i)^(fuel contamination|wrong fuel)' },
          { src = "find08", re = '(?i)^Aircraft-.*fuel.*(contamina|water)|^Aircraft-Fluids/misc hardware-Fluids-Fuel-Fluid (condition|type)', prio = 6 },
          { src = "find_pre08", re = '(?i)^FLUID,\s*FUEL\s*-\s*(CONTAMINA|WATER|IMPROPER GRADE)' } ]
[[node]]
id = "mech.fuel.other"
label = "Other fuel-related condition (leak, venting, storage)"
tier = "mechanism"
explains = ["crit.power_loss", "end", "crit.powerplant"]
match = [ { src = "occ08", re = '(?i)^fuel related' }, { src = "find08", re = '(?i)^Aircraft-Aircraft systems-Fuel system-Fuel storage' } ]
[[node]]
id = "mech.induction_icing"
label = "Carburetor / induction icing"
tier = "mechanism"
explains = ["crit.power_loss"]
match = [ { src = "find08", re = '(?i)^Aircraft-.*(carb\w* ic(e|ing)|induction.*\bic(e|ing)\b)' },
          { src = "find_pre08", re = '(?i)^CARBURETOR ICE|INDUCTION.*ICE' } ]
[[node]]
id = "mech.engine.undetermined"
label = "Engine power loss, reason not determined"
tier = "mechanism"
